name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run ty check

      # No secrets are supplied to this job. The suite must pass with no network
      # and no API spend; `live` tests are deselected by pyproject configuration.
      - name: Test
        run: uv run pytest --cov=src/catchup --cov-report=term-missing
