[project]
name = "catchup"
version = "0.1.0"
description = "Biweekly tech news digest, generated with Claude and published to a newsletter platform"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catchup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-socket -m 'not live'"
markers = [
    "live: makes real, billed API calls. Excluded by default; run with -m live",
]

[tool.coverage.run]
source = ["src/catchup"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
# Ruff also formats Python snippets inside Markdown. We keep it to Python files so it
# never rewrites the specs or the vendored skills under .claude/.
include = ["*.py", "*.pyi", "pyproject.toml"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
